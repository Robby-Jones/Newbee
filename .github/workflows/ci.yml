name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Package tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test NewbeeKit
        working-directory: Packages/NewbeeKit
        run: swift test --parallel
      - name: Test NewbeeShared (Live Activity mapping and planning)
        working-directory: Packages/NewbeeShared
        run: swift test --parallel

  ios:
    name: iOS ${{ matrix.label }}
    # The PR already ran these on the same code, so a merge to main only reruns the Linux package
    # tests. Each run takes 3 of the 5 Macs a free account gets, and the rerun made the next PR's
    # jobs wait for a Mac. Actions → CI → Run workflow still runs everything on main.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # UI tests relaunch the app for every test and take the longest, so they get a Mac of
          # their own and run alongside the unit tests instead of after them. They run on latest
          # iOS only, on one simulator: 3 parallel clones overloaded the runner (PR #63). Each job's
          # scheme (project.yml) builds only the test target it runs.
          - label: UI tests (latest iOS)
            runner: xcode-27
            xcode: "27"
            ios_major: ""
            scheme: NewbeeUITests
            results: ui-latest
          - label: build and unit tests (latest iOS)
            runner: xcode-27
            xcode: "27"
            ios_major: ""
            scheme: NewbeeUnitTests
            results: unit-latest
          # Xcode 27 can't download an iOS 18 simulator runtime ("iOS 18.x is not available for
          # download"), so the iOS 18 leg stays on the macos-15 image with Xcode 26, which can. The
          # app itself (TestFlight) is built with Xcode 27 and the iOS 27 SDK.
          - label: build and unit tests (iOS 18 minimum)
            runner: macos-15
            xcode: "26"
            ios_major: "18"
            scheme: NewbeeUnitTests
            results: unit-18
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: scripts/select-xcode.sh ${{ matrix.xcode }}
      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        # Assign first so a failure stops the job here instead of booting an empty UDID.
        run: |
          UDID="$(scripts/pick-simulator.sh ${{ matrix.ios_major }})"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      # A fresh simulator keeps setting itself up for a few minutes after it first boots, and UI
      # tests that launch the app during that time fail with "Timed out while acquiring background
      # assertion". Boot it and wait before building: booting while building (tried in PR #64)
      # starved the 3-CPU runner and the build took 9 min instead of 3.5 to 6.
      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Newbee.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO \
            NEWBEE_CLOUDKIT_CONTAINER= \
            | xcbeautify --renderer github-actions
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Newbee.xcodeproj \
            -scheme ${{ matrix.scheme }} \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage NO \
            CODE_SIGNING_ALLOWED=NO \
            NEWBEE_CLOUDKIT_CONTAINER= \
            | xcbeautify --renderer github-actions
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.results }}
          path: TestResults.xcresult
