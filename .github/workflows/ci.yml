name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Package tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test NewbeeKit
        working-directory: Packages/NewbeeKit
        run: swift test --parallel
      - name: Test NewbeeShared (Live Activity mapping and planning)
        working-directory: Packages/NewbeeShared
        run: swift test --parallel

  ios:
    name: iOS ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # UI tests relaunch the app for every test and take the longest, so they get a Mac of
          # their own and run alongside the unit tests instead of after them. They run on latest
          # iOS only, on one simulator: 3 parallel clones overloaded the runner (PR #63).
          - label: UI tests (latest iOS)
            ios_major: ""
            test_flags: -only-testing:NewbeeUITests
            results: ui-latest
          - label: build and unit tests (latest iOS)
            ios_major: ""
            test_flags: -skip-testing:NewbeeUITests
            results: unit-latest
          - label: build and unit tests (iOS 18 minimum)
            ios_major: "18"
            test_flags: -skip-testing:NewbeeUITests
            results: unit-18
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: scripts/select-xcode.sh 26
      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: echo "udid=$(scripts/pick-simulator.sh ${{ matrix.ios_major }})" >> "$GITHUB_OUTPUT"
      # A fresh simulator keeps setting itself up for a few minutes after it first boots, and UI
      # tests that launch the app during that time fail with "Timed out while acquiring background
      # assertion". Boot it and wait before building: booting while building (tried in PR #64)
      # starved the 3-CPU runner and the build took 9 min instead of 3.5 to 6.
      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Newbee.xcodeproj \
            -scheme Newbee \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -enableCodeCoverage NO \
            ${{ matrix.test_flags }} \
            CODE_SIGNING_ALLOWED=NO \
            NEWBEE_CLOUDKIT_CONTAINER= \
            | xcbeautify --renderer github-actions
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Newbee.xcodeproj \
            -scheme Newbee \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage NO \
            ${{ matrix.test_flags }} \
            CODE_SIGNING_ALLOWED=NO \
            NEWBEE_CLOUDKIT_CONTAINER= \
            | xcbeautify --renderer github-actions
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.results }}
          path: TestResults.xcresult
